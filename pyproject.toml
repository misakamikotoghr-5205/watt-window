[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "watt-window"
version = "1.0.0"
description = "Explainable finite-grid advisory scheduling for noncritical loads"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
watt-window = "watt_window.__main__:main"

[tool.setuptools]
packages = ["watt_window"]
